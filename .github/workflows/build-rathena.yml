name: Build Vastil rAthena Server

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build rAthena x86_64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout rAthena
        uses: actions/checkout@v4
        with:
          repository: rathena/rathena
          ref: 2fe6ab3dc4d830b11d93fb44c3b48436571890bd
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            make \
            gcc \
            g++ \
            zlib1g-dev \
            libpcre3-dev \
            libmariadb-dev \
            libmariadb-dev-compat

      - name: Verify Dependencies
        run: |
          echo "=== Compiler ==="
          gcc --version
          g++ --version

          echo "=== MariaDB / MySQL compatibility ==="
          which mysql_config
          mysql_config --version

          echo "=== MySQL client library ==="
          ls -l /usr/lib/x86_64-linux-gnu/libmysqlclient.so

      - name: Configure rAthena
        run: |
          ./configure \
            --enable-prere=no \
            --enable-packetver=20211103

      - name: Compile Server
        run: |
          make clean
          make server -j"$(nproc)"

      - name: Verify Binaries
        run: |
          echo "=== Binary files ==="
          ls -lh login-server char-server map-server

          echo "=== Architecture ==="
          file login-server
          file char-server
          file map-server

          echo "=== Missing libraries ==="

          if ldd login-server | grep -q "not found"; then
            ldd login-server
            exit 1
          fi

          if ldd char-server | grep -q "not found"; then
            ldd char-server
            exit 1
          fi

          if ldd map-server | grep -q "not found"; then
            ldd map-server
            exit 1
          fi

          echo "All runtime libraries found."

      - name: Package Server Files
        run: |
          mkdir -p rathena-build

          cp \
            login-server \
            char-server \
            map-server \
            athena-start \
            rathena-build/

          cp -r \
            conf \
            db \
            npc \
            sql-files \
            rathena-build/

          cat > rathena-build/VASTIL_BUILD_INFO.txt <<EOF
          Project: Vastil rAthena Development Server
          Architecture: x86_64 Linux
          PACKETVER: 20211103
          rAthena Commit: 2fe6ab3dc4d830b11d93fb44c3b48436571890bd
          Runner: Ubuntu 24.04
          EOF

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rathena-vastil-20211103-linux-x64
          path: rathena-build/
          if-no-files-found: error
          retention-days: 30
