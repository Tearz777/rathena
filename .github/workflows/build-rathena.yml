name: Build Vastil rAthena Server

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build rAthena x86_64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout rAthena
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          repository: rathena/rathena
          ref: 2fe6ab3dc4d830b11d93fb44c3b48436571890bd
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            make \
            gcc \
            g++ \
            zlib1g-dev \
            libpcre3-dev \
            libmariadb-dev \
            libmariadb-dev-compat

      - name: Verify Dependencies
        run: |
          echo "=== Compiler ==="
          gcc --version
          g++ --version

          echo "=== MySQL/MariaDB compatibility ==="
          which mysql_config
          mysql_config --version

          echo "=== Client library ==="
          ls -l /usr/lib/x86_64-linux-gnu/libmysqlclient.so

      - name: Configure rAthena
        run: |
          ./configure \
            --enable-packetver=20211103

      - name: Compile Server
        run: |
          make clean
          make server -j"$(nproc)"

      - name: Verify Binaries
        run: |
          echo "=== Files ==="
          ls -lh login-server char-server map-server

          echo "=== Architecture ==="
          file login-server
          file char-server
          file map-server

          echo "=== Runtime dependencies ==="
          ldd login-server
          ldd char-server
          ldd map-server

          if ldd login-server | grep -q "not found"; then
            echo "Missing library in login-server"
            exit 1
          fi

          if ldd char-server | grep -q "not found"; then
            echo "Missing library in char-server"
            exit 1
          fi

          if ldd map-server | grep -q "not found"; then
            echo "Missing library in map-server"
            exit 1
          fi

      - name: Package Server
        run: |
          mkdir -p rathena-build

          cp login-server rathena-build/
          cp char-server rathena-build/
          cp map-server rathena-build/
          cp athena-start rathena-build/

          cp -r conf rathena-build/
          cp -r db rathena-build/
          cp -r npc rathena-build/
          cp -r sql-files rathena-build/

          cat > rathena-build/VASTIL_BUILD_INFO.txt <<'EOF'
          Vastil rAthena Development Server

          Architecture: x86_64 Linux
          PACKETVER: 20211103
          rAthena Commit: 2fe6ab3dc4d830b11d93fb44c3b48436571890bd
          Build Runner: Ubuntu 24.04
          EOF

      - name: Upload Artifact
        uses: actions/upload-artifact@0b2256b8c012f0828dc542b3febcab082c67f72b
        with:
          name: rathena-vastil-20211103-linux-x64
          path: rathena-build/
          if-no-files-found: error
          retention-days: 30
