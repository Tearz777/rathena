name: Build rAthena Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce

      - name: Build rAthena
        shell: powershell
        run: |
          msbuild .\rAthena.sln `
            /m `
            /p:Configuration=Release

      - name: Find server binaries
        shell: powershell
        run: |
          Write-Host "=== login-server ==="
          Get-ChildItem -Path . -Recurse -Filter "login-server.exe" |
            Select-Object FullName

          Write-Host "=== char-server ==="
          Get-ChildItem -Path . -Recurse -Filter "char-server.exe" |
            Select-Object FullName

          Write-Host "=== map-server ==="
          Get-ChildItem -Path . -Recurse -Filter "map-server.exe" |
            Select-Object FullName

      - name: Collect binaries
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path .\artifact

          $files = @(
            "login-server.exe",
            "char-server.exe",
            "map-server.exe"
          )

          foreach ($file in $files) {
            $found = Get-ChildItem -Path . -Recurse -Filter $file |
              Select-Object -First 1

            if (-not $found) {
              throw "$file not found after build"
            }

            Copy-Item $found.FullName .\artifact\
          }

          Get-ChildItem .\artifact

      - name: Upload rAthena binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rathena-windows
          path: artifact/*.exe
          if-no-files-found: error
          retention-days: 7
